<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/styles.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="brand"
        >
            PocketSmart AI
        </a>

        <div class="nav-links">

            {% if user %}

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/home-planner">
                    Home
                </a>

                <a href="/party-planner">
                    Party
                </a>

                <a href="/jewelry-planner">
                    Jewelry
                </a>

                <a href="/history">
                    History
                </a>

                <a href="/logout">
                    Logout
                </a>

            {% else %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>
    PocketSmart AI — Smart budgeting and AI recommendations.
</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
